<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="爆单兽erp">
  <!-- 与 shared/base.css 的 .brand-logo 同源：同一组渐变色、同一枚白字 O、同样的圆角方块。
       此前没有 favicon，浏览器每次都会请求 /favicon.ico 并拿到 404。 -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a1f" />
      <stop offset="0.42" stop-color="#ff5f2e" />
      <stop offset="1" stop-color="#ef2f45" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="20" fill="url(#brand)" />
  <rect x="6" y="6" width="52" height="52" rx="16" fill="none" stroke="#fff8ed" stroke-opacity="0.22" />
  <text x="32" y="44" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#fff8ed">O</text>
</svg>
