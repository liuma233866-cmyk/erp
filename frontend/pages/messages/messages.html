          <section id="messagesPanel" class="panel hidden">
            <div class="panel-head">
              <h3>消息管理</h3>
              <button id="refreshMessagesBtn">刷新消息</button>
            </div>
            <form id="addMessageForm" class="inline-form">
              <input name="title" type="text" placeholder="消息标题" required />
              <input name="content" type="text" placeholder="消息内容" required />
              <button type="submit">发布消息</button>
            </form>
            <p id="messagesMessage" class="message small"></p>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>标题</th>
                    <th>内容</th>
                    <th>发布人</th>
                    <th>发布时间</th>
                  </tr>
                </thead>
                <tbody id="messagesTableBody"></tbody>
              </table>
            </div>
          </section>
