          <section id="financeProfitPanel" class="panel hidden">
            <div class="panel-head">
              <h3>订单利润</h3>
            </div>
            <p id="financeProfitMessage" class="message small">利润按审核规则计算。</p>
            <div class="online-summary-grid" style="margin-bottom:14px;">
              <article class="online-summary-card">
                <span>利润异常订单</span>
                <strong id="profitIssueCount">0</strong>
              </article>
              <article class="online-summary-card">
                <span>缺少规则</span>
                <strong id="profitIssueMissingRuleCount">0</strong>
              </article>
              <article class="online-summary-card">
                <span>缺少利润快照</span>
                <strong id="profitIssueMissingSnapshotCount">0</strong>
              </article>
            </div>
            <p id="profitIssueMessage" class="message small">正在检查利润异常...</p>
            <div class="table-wrap finance-purchase-table-wrap" style="margin-bottom:14px;">
              <table>
                <thead>
                  <tr>
                    <th>订单号</th>
                    <th>店铺</th>
                    <th>异常原因</th>
                    <th>匹配产品</th>
                    <th>规则</th>
                    <th>更新时间</th>
                  </tr>
                </thead>
                <tbody id="profitIssueTableBody"></tbody>
              </table>
            </div>
            <div class="online-summary-grid">
              <article class="online-summary-card">
                <span>命中规则订单</span>
                <strong id="financeProfitMatchedCount">0</strong>
              </article>
              <article class="online-summary-card">
                <span>利润合计 RMB</span>
                <strong id="financeProfitTotalRmb">0.00</strong>
              </article>
              <article class="online-summary-card">
                <span>利润合计 RUB</span>
                <strong id="financeProfitTotalRub">0.00</strong>
              </article>
            </div>
            <form id="financeProfitFilterForm" class="inline-form finance-profit-filter-form">
              <input id="financeProfitFilterOrderNo" name="orderNo" type="text" placeholder="订单号（支持部分匹配）" />
              <input id="financeProfitFilterSku" name="sku" type="text" placeholder="SKU（支持部分匹配）" />
              <select id="financeProfitFilterReceipt" name="receiptCode">
                <option value="">订单状态(全部)</option>
                <option value="received">已收货 / Received</option>
                <option value="ready_for_pickup">待顾客取件 / Ready for pickup</option>
                <option value="in_delivery">配送中 / In delivery</option>
                <option value="not_received">顾客未收到 / Customer not received</option>
                <option value="returned">已退货 / Returned</option>
              </select>
              <input id="financeProfitFilterMin" name="profitMin" type="number" step="0.01" placeholder="利润(RUB) 最小" />
              <input id="financeProfitFilterMax" name="profitMax" type="number" step="0.01" placeholder="利润(RUB) 最大" />
              <button type="submit">筛选</button>
              <button id="financeProfitFilterResetBtn" type="button" class="secondary-btn">重置</button>
            </form>
            <div class="table-wrap finance-purchase-table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>订单号</th>
                    <th>店铺</th>
                    <th>SKU</th>
                    <th>规则</th>
                    <th>订单金额(RUB)</th>
                    <th>采购(RMB)</th>
                    <th>采购(RUB)</th>
                    <th>利润(RMB)</th>
                    <th>利润(RUB)</th>
                    <th>订单状态</th>
                  </tr>
                </thead>
                <tbody id="financeProfitTableBody"></tbody>
              </table>
            </div>
            <div class="online-pagination finance-profit-pagination">
              <button id="financeProfitPrevPageBtn" type="button" class="secondary-btn">‹</button>
              <span id="financeProfitPaginationInfo">1 / 1</span>
              <button id="financeProfitNextPageBtn" type="button" class="secondary-btn">›</button>
              <span>前往</span>
              <input id="financeProfitGotoPage" name="financeProfitGotoPage" type="number" min="1" step="1" aria-label="跳转到页码" />
              <span>页</span>
              <select id="financeProfitPageSize" name="financeProfitPageSize" aria-label="每页显示条数">
                <option value="20" selected>20条/页</option>
                <option value="50">50条/页</option>
                <option value="100">100条/页</option>
              </select>
            </div>
          </section>
