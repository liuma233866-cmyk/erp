          <section id="systemPanel" class="panel hidden">
            <div class="panel-head"><h3>系统管理</h3></div>
            <div class="report-grid">
              <article class="report-card accent-blue">
                <div class="report-card-head"><h4>审核规则</h4><span>规则</span></div>
                <small>维护利润核算与审核参数。</small>
                <button class="secondary-btn" type="button" data-view="reviewRulesPanel">进入</button>
              </article>
              <article class="report-card accent-teal">
                <div class="report-card-head"><h4>类目映射</h4><span>映射</span></div>
                <small>统一来源类目与平台类目关系。</small>
                <button class="secondary-btn" type="button" data-view="categoryMappingPanel">进入</button>
              </article>
              <article class="report-card accent-amber">
                <div class="report-card-head"><h4>Yandex佣金</h4><span>费率</span></div>
                <small>查看并同步佣金目录与链接。</small>
                <button class="secondary-btn" type="button" data-view="yandexCommissionPanel">进入</button>
              </article>
              <article class="report-card accent-blue">
                <div class="report-card-head"><h4>物流费用</h4><span>运费</span></div>
                <small>估算不同模式下的物流成本。</small>
                <button class="secondary-btn" type="button" data-view="logisticsFeePanel">进入</button>
              </article>
              <article class="report-card accent-teal">
                <div class="report-card-head"><h4>AI配置</h4><span>模型</span></div>
                <small>在 ERP 中维护 AI 服务地址、模型和密钥。</small>
                <button class="secondary-btn" type="button" data-view="aiConfigPanel">进入</button>
              </article>
              <article class="report-card accent-amber">
                <div class="report-card-head"><h4>AI图任务</h4><span>任务</span></div>
                <small>统一管理采集后进入 AI 的换背景任务。</small>
                <button class="secondary-btn" type="button" data-view="aiImageTaskPanel">进入</button>
              </article>
            </div>
          </section>
